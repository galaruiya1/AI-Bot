# BTC-USDT perpetual HFT clip config for pmm_mister_hft.
#
# Account: 365.81 USDT, 20x, 800 USDT notional per open.
# Margin per clip = 800 / 20 = 40 USDT.
# Max notional at 20x ≈ 7316 USDT; this file keeps 1 buy + 1 sell clip (1600 notional, 80 USDT margin).
#
# Barriers (gross, on the 800 USDT clip):
#   take_profit 1.5 bps = 0.12 USDT
#   stop_loss   5.0 bps = 0.40 USDT  (market)
#
# Binance USDT-M default maker 2 bps/side → round-trip 4 bps = 0.32 USDT.
# A 1.5 bps take-profit is then -2.5 bps net. 1.5 bps *net* needs ~0 maker or
# take_profit: 0.00055 (1.5 + 4). Position mode must match the Binance account.

id: pmm_mister_hft_btc
controller_name: pmm_mister_hft
controller_type: generic

connector_name: binance_perpetual
trading_pair: BTC-USDT
leverage: 20
position_mode: HEDGE
position_side: BUY

# Inventory scale (notional). One 800 fill = 50% of this book.
total_amount_quote: 1600
portfolio_allocation: 1
order_notional_quote: 800
target_base_pct: 0.5
min_base_pct: 0.25
max_base_pct: 0.70
min_skew: 0.25

price_source: best_bid_ask
join_touch: true
tick_mode: true
buy_spreads:
  - 1
sell_spreads:
  - 1
buy_amounts_pct:
  - 1
sell_amounts_pct:
  - 1

executor_refresh_time: 3
buy_cooldown_time: 4
sell_cooldown_time: 4
buy_position_effectivization_time: 8
sell_position_effectivization_time: 8
max_active_executors_by_level: 1

price_distance_tolerance: 1
refresh_tolerance: 2
tolerance_scaling: 1.5

open_order_type: LIMIT_MAKER
take_profit_order_type: LIMIT_MAKER
take_profit: 0.00015
stop_loss: 0.0005
time_limit: 120
position_profit_protection: true

# Account-level circuit breaker (percent of position), not the 5 bps clip stop.
global_tp_enabled: true
global_sl_enabled: true
global_take_profit: 0.01
global_stop_loss: 0.02
global_tp_activation_from: min_base
global_sl_activation_from: target_base
global_pnl_reference: position

manual_kill_switch: false
