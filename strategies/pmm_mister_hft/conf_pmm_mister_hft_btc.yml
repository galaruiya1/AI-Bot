# BTC high-frequency overlay on stock pmm_mister.
# Copy to hummingbot/conf/controllers/ then: hbot start conf_pmm_mister_hft_btc.yml
#
# Capital: each quote size is
#   total_amount_quote * portfolio_allocation * (level_pct / sum(all_level_pcts))
# With 5+3+2 on both sides, the tightest level is 5/20 = 25% of allocated capital.
# 200 * 0.5 * 0.25 = 25 USDT, above Binance BTC-USDT min notional.

id: pmm_mister_hft_btc
controller_name: pmm_mister_hft
controller_type: generic

connector_name: binance
trading_pair: BTC-USDT
leverage: 1
position_mode: ONEWAY
position_side: BUY

total_amount_quote: 200
portfolio_allocation: 0.5
target_base_pct: 0.5
min_base_pct: 0.35
max_base_pct: 0.65
min_skew: 0.25

price_source: best_bid_ask
join_touch: true
tick_mode: true
buy_spreads:
  - 1
  - 3
  - 8
sell_spreads:
  - 1
  - 3
  - 8
buy_amounts_pct:
  - 5
  - 3
  - 2
sell_amounts_pct:
  - 5
  - 3
  - 2

executor_refresh_time: 3
buy_cooldown_time: 4
sell_cooldown_time: 4
buy_position_effectivization_time: 15
sell_position_effectivization_time: 15
max_active_executors_by_level: 1

# Tick units (see pmm_mister_hft.py). Refresh if a live quote is 2 ticks off theoretical.
price_distance_tolerance: 1
refresh_tolerance: 2
tolerance_scaling: 1.5

open_order_type: LIMIT_MAKER
take_profit_order_type: LIMIT_MAKER
# 6 bps. Must stay above 2x maker fee or the book loses money.
take_profit: 0.0006
position_profit_protection: true

global_tp_enabled: true
global_sl_enabled: true
global_take_profit: 0.008
global_stop_loss: 0.015
global_tp_activation_from: min_base
global_sl_activation_from: target_base
global_pnl_reference: position

manual_kill_switch: false
